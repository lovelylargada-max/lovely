<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAGRADO Poultry — Quick-Order & Logistics Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-[#FDFBF7]">
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      const CATEGORIES = ['4-Month-Old Chickens','5-Month-Old Chickens','6-Month-Old & Older'];
      const RANGES = { '4-Month-Old Chickens':[150,250], '5-Month-Old Chickens':[250,350], '6-Month-Old & Older':[350,450] };
      const BREEDS = ['Rhode Island Red','Australorp','Plymouth Rock','Native Chicken','No Preference'];
      const GUIDES = {
        '4-Month-Old Chickens': {feed:'Starter/grower feed appropriate for young chickens.',water:'Provide clean, fresh water at all times.',housing:'Clean, well-ventilated coop with enough space.',care:'Daily checks, clean bedding, safe from predators.',health:'Monitor activity, appetite, and droppings.',vet:'Keep vaccination records; consult a vet for schedules.'},
        '5-Month-Old Chickens': {feed:'Grower/layer transition feed as appropriate.',water:'Constant access to clean water.',housing:'Adequate ventilation and nesting areas.',care:'Regular cleaning and observation.',health:'Watch for signs of illness or stress.',vet:'Maintain records; seek veterinary advice when needed.'},
        '6-Month-Old & Older': {feed:'Layer/maintenance feed suited to purpose.',water:'Fresh water available daily.',housing:'Spacious, ventilated housing with roosts.',care:'Daily monitoring and coop hygiene.',health:'Check egg production and general condition.',vet:'Keep vaccination history; consult vet for boosters.'},
      };
      function Header(){return (<header className="bg-[#065F46] text-white shadow"><div className="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between"><div className="flex items-center gap-2"><span className="text-2xl">🐔</span><span className="font-bold text-xl">LAGRADO Poultry</span></div><span className="text-sm opacity-90 hidden sm:block">Lagardo's Farm</span></div></header>);}
      function Hero({onStart}){return (<section className="bg-[#FDFBF7]"><div className="max-w-6xl mx-auto px-4 py-12 flex flex-col md:flex-row items-center gap-8"><div className="flex-1"><h1 className="text-3xl md:text-5xl font-bold text-[#065F46]">Fresh Poultry, Quick Orders</h1><p className="mt-4 text-gray-700">Order quality chickens from Lagardo's Farm.</p><button onClick={onStart} className="mt-6 bg-[#D97706] text-white px-6 py-3 rounded-lg font-semibold">Start Your Order</button></div><div className="flex-1 text-center text-8xl">🐓</div></div></section>);}
      function OrderForm({order,setOrder}){const [rmin,rmax]=RANGES[order.category];const today=new Date().toISOString().split('T')[0];return (<form className="space-y-4 bg-white rounded-xl shadow p-4">
        <div><label className="block text-sm font-medium">Chicken Age Group</label><select value={order.category} onChange={e=>{const c=e.target.value;setOrder(o=>({...o,category:c,price:RANGES[c][0]}))}} className="w-full border rounded p-2">{CATEGORIES.map(c=><option key={c}>{c}</option>)}</select></div>
        <div><label className="block text-sm font-medium">Quantity</label><input type="number" min="1" value={order.quantity} onChange={e=>setOrder(o=>({...o,quantity:e.target.value}))} className="w-full border rounded p-2"/></div>
        <div><label className="block text-sm font-medium">Breed</label><select value={order.breed} onChange={e=>setOrder(o=>({...o,breed:e.target.value}))} className="w-full border rounded p-2">{BREEDS.map(b=><option key={b}>{b}</option>)}</select></div>
        <div><label className="block text-sm font-medium">Price per Chicken (₱{rmin}-₱{rmax})</label><input type="number" min={rmin} max={rmax} value={order.price} onChange={e=>setOrder(o=>({...o,price:e.target.value}))} className="w-full border rounded p-2"/></div>
        <div><label className="block text-sm font-medium">Preferred Date</label><input type="date" min={today} value={order.date} onChange={e=>setOrder(o=>({...o,date:e.target.value}))} className="w-full border rounded p-2"/></div>
        <div><label className="block text-sm font-medium">Pickup or Delivery</label><select value={order.method} onChange={e=>setOrder(o=>({...o,method:e.target.value}))} className="w-full border rounded p-2"><option>Pickup</option><option>Delivery</option></select></div>
        <div><label className="block text-sm font-medium">Contact (Phone or Email)</label><input type="text" value={order.contact} onChange={e=>setOrder(o=>({...o,contact:e.target.value}))} className="w-full border rounded p-2"/></div>
        <div><label className="block text-sm font-medium">Additional Notes</label><textarea value={order.notes} onChange={e=>setOrder(o=>({...o,notes:e.target.value}))} className="w-full border rounded p-2" rows="3"/></div>
      </form>);}
      function OrderSummary({order}){const total=(Number(order.quantity)||0)*(Number(order.price)||0);return (<div className="bg-white rounded-xl shadow p-4"><h2 className="text-xl font-bold text-[#065F46] mb-3">Order Summary</h2><ul className="space-y-1 text-sm"><li><strong>Category:</strong> {order.category}</li><li><strong>Quantity:</strong> {order.quantity}</li><li><strong>Breed:</strong> {order.breed}</li><li><strong>Price per chicken:</strong> ₱{order.price}</li><li><strong>Method:</strong> {order.method}</li><li><strong>Date:</strong> {order.date}</li><li><strong>Contact:</strong> {order.contact||'-'}</li><li><strong>Notes:</strong> {order.notes||'-'}</li></ul><div className="mt-3 text-lg font-bold text-[#D97706]">Estimated Total: ₱{total.toLocaleString()}</div></div>);}
      function MessageBuilder({order}){const total=(Number(order.quantity)||0)*(Number(order.price)||0);const msg=`Hi Feather & Farm! I would like to reserve:\nQuantity: ${order.quantity} chickens\nCategory: ${order.category}\nBreed: ${order.breed}\nPrice per chicken: ₱${order.price}\nEstimated total: ₱${total.toLocaleString()}\nPreferred Date: ${order.date}\nPickup/Delivery: ${order.method}\nContact: ${order.contact}\nAdditional Notes: ${order.notes}\n\nPlease confirm availability and the final order details. Thank you!`;const [copied,setCopied]=useState(false);const copy=()=>{navigator.clipboard.writeText(msg).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)})};const enc=encodeURIComponent(msg);const sms=`sms:0991-436-6688?body=${enc}`;const email=`mailto:gladys_alboro@sjp2cd.edu.ph?subject=${encodeURIComponent('Poultry Order')}&body=${enc}`;return (<div className="bg-white rounded-xl shadow p-4 space-y-3"><h2 className="text-xl font-bold text-[#065F46]">Order Message</h2><pre className="whitespace-pre-wrap bg-[#FDFBF7] p-3 rounded text-sm">{msg}</pre><div className="flex flex-wrap gap-2"><a href={sms} className="bg-[#065F46] text-white px-4 py-2 rounded">Send via SMS</a><a href={email} className="bg-[#D97706] text-white px-4 py-2 rounded">Send Email</a><button onClick={copy} className="border border-[#065F46] text-[#065F46] px-4 py-2 rounded">{copied?'Copied!':'Copy Order Message'}</button></div><p className="text-xs text-gray-600">You must confirm and send the message in your messaging or email app.</p></div>);}
      function FarmCareGuide({category}){const g=GUIDES[category];return (<div className="bg-white rounded-xl shadow p-4"><h2 className="text-xl font-bold text-[#065F46] mb-3">Farm Care Guide — {category}</h2><ul className="space-y-2 text-sm"><li><strong>Feed:</strong> {g.feed}</li><li><strong>Water:</strong> {g.water}</li><li><strong>Housing:</strong> {g.housing}</li><li><strong>Daily care:</strong> {g.care}</li><li><strong>Health:</strong> {g.health}</li><li><strong>Vaccination/Vet:</strong> {g.vet}</li></ul><p className="text-xs text-gray-600 mt-3">Recommendations depend on breed, purpose, health, and vaccination history.</p></div>);}
      function Footer(){return (<footer className="bg-[#065F46] text-white text-center py-4 mt-8"><p className="text-sm">© {new Date().getFullYear()} LAGRADO Poultry — Feather & Farm Poultry. All rights reserved.</p></footer>);}
      function App(){const [tab,setTab]=useState('order');const [order,setOrder]=useState({category:CATEGORIES[0],quantity:1,breed:'No Preference',price:150,date:'',method:'Pickup',contact:'',notes:''});return (<div className="min-h-screen bg-[#FDFBF7]"><Header/><Hero onStart={()=>setTab('order')}/><nav className="max-w-6xl mx-auto px-4 py-4 flex gap-2 flex-wrap">{[['order','Place an Order'],['message','Order Message'],['care','Farm Care Guide']].map(([k,l])=><button key={k} onClick={()=>setTab(k)} className={`px-4 py-2 rounded ${tab===k?'bg-[#065F46] text-white':'bg-white text-[#065F46] border'}`}>{l}</button>)}</nav><main className="max-w-6xl mx-auto px-4 pb-8 grid md:grid-cols-2 gap-6">{tab==='order'&&<><OrderForm order={order} setOrder={setOrder}/><OrderSummary order={order}/></>}{tab==='message'&&<MessageBuilder order={order}/>}{tab==='care'&&<FarmCareGuide category={order.category}/>}</main><Footer/></div>);}
      ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
